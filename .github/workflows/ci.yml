name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

jobs:
  test:
    name: test (ubuntu-latest, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # Integration tests require tmux 3.8; distro packages are older, so
      # build the official release and verify the tarball checksum.
      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential libevent-dev libncurses-dev pkg-config

      - name: Cache tmux ${{ env.TMUX_VERSION }}
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tmux
          key: tmux-${{ env.TMUX_VERSION }}-${{ env.TMUX_SHA256 }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tmux ${{ env.TMUX_VERSION }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo tmux.tar.gz "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          echo "${TMUX_SHA256}  tmux.tar.gz" | sha256sum -c -
          tar -xzf tmux.tar.gz
          cd "tmux-${TMUX_VERSION}"
          ./configure --prefix="$HOME/.local/tmux"
          make -j"$(nproc)"
          make install

      - name: Put tmux ${{ env.TMUX_VERSION }} on PATH
        run: |
          echo "$HOME/.local/tmux/bin" >> "$GITHUB_PATH"
          "$HOME/.local/tmux/bin/tmux" -V
          test "$("$HOME/.local/tmux/bin/tmux" -V)" = "tmux ${TMUX_VERSION}"

      - name: Verify gofmt-clean sources
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run unit tests
        run: make test-verbose

      - name: Run tests with race detector
        run: make test-race

      - name: Build (versioned)
        run: make build VERSION=v0.0.0-test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              out="dist/tmux-qs-${goos}-${goarch}"
              GOOS=$goos GOARCH=$goarch go build -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
              chmod +x "$out"
            done
          done

      - name: Create checksums
        run: |
          cd dist
          sha256sum tmux-qs-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
