name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu-latest, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install system dependencies (tmux for integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Verify gofmt-clean sources
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run unit tests
        run: make test-verbose

      - name: Run tests with race detector
        run: make test-race

      - name: Build (versioned)
        run: make build VERSION=v0.0.0-test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              out="dist/tmux-qs-${goos}-${goarch}"
              GOOS=$goos GOARCH=$goarch go build -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
              chmod +x "$out"
            done
          done

      - name: Create checksums
        run: |
          cd dist
          sha256sum tmux-qs-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
